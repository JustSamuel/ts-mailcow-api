name: Release

# Manual publish to npm using trusted publishing (OIDC). No NPM_TOKEN
# secret is needed -- npm authenticates the GitHub-issued OIDC token
# against the trusted publisher rule configured on the package.
# See https://docs.npmjs.com/trusted-publishers for setup.
#
# Trigger: bump the version in package.json on master, then run this
# workflow from the Actions tab. It builds, publishes to npm with
# provenance, and pushes a v<version> tag.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        # Node 24 ships with npm 11.x. Trusted publishing needs npm
        # 11.5.1+; the lint/build CI can stay on Node 22 LTS.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Read package version
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.pkg.outputs.version }} already exists -- bump package.json first."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Tag release
        run: |
          git tag "v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"
