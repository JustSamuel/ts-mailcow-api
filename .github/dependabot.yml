version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "JustSamuel"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development_minors_and_patches:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production_patches:
        dependency-type: "production"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "JustSamuel"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
